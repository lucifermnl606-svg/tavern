<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavern RPG - v8.9.3</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body id="game-body">

    <div id="turn-indicator"></div>

    <div id="death-screen">
        <div class="death-box">
            <h1 id="death-message">U bent Dood 💀</h1>
            <p>Je bent uitgeschakeld.</p>
            <button class="btn-gold" id="res-btn" onclick="resurrect()">KOM TERUG (20 COINS)</button>
            <button class="btn-gold" style="background:#444; color:white;" onclick="permDeath()">NIEUW KARAKTER</button>
        </div>
    </div>

    <div id="login-screen">
        <h1 onclick="document.getElementById('dm-console').style.display='block'"
            style="color:var(--gold); cursor:pointer;">THE TAVERN 8.9.3</h1>
        <input type="text" id="login-name" placeholder="Naam..." class="input-dark">
        <input type="password" id="login-pass" placeholder="Wachtwoord" class="input-dark">
        <select id="login-class" class="input-dark">
            <option value="Wizard">Wizard</option>
            <option value="Bard">Bard</option>
            <option value="Rogue">Rogue</option>
            <option value="Paladin">Paladin</option>
            <option value="Wench">Wench</option>
            <option value="Bouncer">Bouncer</option>
            <option value="Monk">Monk</option>
            <option value="Necro">Necro</option>
            <option value="Druid">Druid</option>
            <option value="Gravedigger">Gravedigger</option>
        </select>
        <button class="btn-gold" onclick="enterTavern()">START</button>
    </div>

    <div id="main-app" style="display:none;">
        <h2 id="disp-name" style="color:var(--gold); margin:0;"></h2>
        <div id="zombie-timer-display" style="color:var(--green); font-weight:bold; margin-bottom:10px;"></div>
        <div class="stats-grid" id="stat-container"></div>
        <div class="ability-grid" id="ability-container"></div>
        <button id="end-turn-btn" class="btn-end-turn" onclick="passTurn()">🛑 EINDIG MIJN BEURT</button>

        <div id="dm-console">
            <h4 style="margin:0; color:var(--gold)">DM PANEL</h4>
            <div id="player-status-list" style="font-size: 12px; color: #ccc; margin: 10px 0;"></div>
            <button class="btn-gold" style="background:#444; color:white; padding:5px;" onclick="cleanseAll()">UNBLOCK &
                CLEANSE ALL</button>
        </div>
    </div>

    <div id="target-overlay" class="overlay">
        <div class="modal">
            <h3>KIES DOELWIT</h3>
            <div id="target-list"></div>
            <button class="btn-gold" onclick="closeOverlay()" style="background:#666">ANNULEREN</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
